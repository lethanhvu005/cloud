services:
  - type: web
    name: cloud-book-manager
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm run start:cloud
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.14.0
      - key: STUDENT_NAME
        sync: false
      - key: STUDENT_ID
        sync: false
      - key: MONGO_URI_READ
        sync: false
      - key: MONGO_URI_WRITE
        sync: false
      - key: SESSION_URI
        sync: false
      - key: SESSION_SECRET
        generateValue: true
